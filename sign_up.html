<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an account | UnivBid</title>
    <link rel="stylesheet" href="Styles/style_sign.css">
    <link rel="stylesheet" href="Styles/main.css">
    <link rel="stylesheet" href="Styles/portfolio.css">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <div class="main-container ">
        <img src="Images/logo-transparent_.png" alt="UnivBid" class="logo">
        <div class="form-container signUP">
            <h2>Create Your Account</h2>
            <p style="margin-bottom: 24px; font-size:14px">Join your campus community on UnivBid</p>
            <form id="sign_upform">
                <div class="input-group-flex">
                    <div class="input-group">
                        <label for="Fname">First Name: </label>
                        <input type="text" id="Fname" name="firstName" placeholder="John" required>
                    </div>
                    <div class="input-group">
                        <label for="Lname">Last Name: </label>
                        <input type="text" id="Lname" name="lastName" placeholder="Doe" required>
                    </div>
                </div>

                <div class="input-group-flex">
                    <div class="input-group">
                        <label for="university">University: </label>
                        <input type="text" id="university" name="university" placeholder="University name">
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">Email address: </label>
                    <input type="email" id="email" name="email" placeholder="name@university.edu"
                        required>
                    <!-- <small style="font-size:x-small"><i>Use your Univeristy email address for verification
                        </i></small> -->
                </div>

                <div class="input-group-flex">
                    <div class="input-group">
                        <label for="password">Password: </label>
                        <input type="password" id="password" name="password" minlength="8" placeholder="🔒 Password"
                            required>
                    </div>
                </div>
                <div class="input-group">
                    <label for="confirm-password">Confirm Password: </label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="🔒 Password"
                        required>
                </div>
                <button type="submit" class="btn-primary" id="submit">Create Account</button>
            </form>
            <p>Already have an account? <a href="sign_in.html">Sign In</a></p>
        </div>
    </div>
    <div id="global-notification" class="notification hidden">
        <div class="notification-content">
            <span id="notification-message"></span>
            <button class="notification-close">&times;</button>
        </div>
    </div>
</body>
<script type="module" src="Scripts/pages/sign_up.js" defer></script>
<script type="module" src="firebase.js" defer></script>

</html>
