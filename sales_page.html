<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse listings | UnivBid</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Merriweather:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="Styles/main.css">
    <link rel="stylesheet" href="Styles/style_sales_page.css">
    <link rel="stylesheet" href="Styles/portfolio.css">

</head>

<body>

    <nav class="main-header-nav">
         <img src="Images/logo-transparent_.png" alt="UnivBid Logo" class="logo">

        <div class="search_bar">
            <input type="search" name="search_input" placeholder="Search listings" aria-label="Search listings">
            <button id="search_btn" type="button" aria-label="Search listings">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
        
        <div class="link-navbar" id="loggedin_nav">
            <button id="add_product_btn"> <big>+</big> &nbsp; Create Auction </button>
            <i class="fa-solid fa-bell"></i>
            <i class=" fa-solid fa-shopping-cart"></i>
            <div class="profile_avatar_container">
                <a href="profile.html"> <img src="Images/11.png" alt="Your profile" id="profile_pic"> </a>
            </div>
        </div>
    </nav>

    <div id="global-notification" class="notification hidden">
        <div class="notification-content">
            <span id="notification-message"></span>
            <button class="notification-close">&times;</button>
        </div>
    </div>
</body>

<script type="module" src="firebase.js" defer></script>
<script type="module" src="Scripts/pages/sales_page.js" defer></script>

</html>
